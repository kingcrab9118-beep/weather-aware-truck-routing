# Single Docker service: Django API + built React SPA
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance
services:
  - type: web
    name: weather-aware-truck-routing
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ORS_API_KEY
        sync: false
